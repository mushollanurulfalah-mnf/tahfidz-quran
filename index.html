VIEWS.murojaah=()=>{const L=D.murojaah.filter(m=>m.sid==$S().id).sort((a,b)=>pri(b)-pri(a));
 return `<h1>🔄 Murojaah</h1><div class="card"><button class="btn s" onclick="openM(addMur())">+ Tambah Hafalan Lama</button></div>`+(L.map(m=>{const p=pri(m),c=p>=60?['R','🔴 Perlu Murojaah']:p>=30?['Y','🟡 Cukup']:['G','🟢 Lancar'];const i=D.murojaah.indexOf(m);return `<div class="card row sp"><div><b>Surah ${SR[m.s-1].nama}</b><div class="m">Terakhir: ${days(m.last)==0?'Hari ini':days(m.last)+' hari lalu'} • nilai ${m.nilai}</div><span class="pill ${c[0]}">${c[1]}</span></div><button class="btn s" onclick="murDone(${i})">Selesai Murojaah</button></div>`}).join('')||'<p class="m">Belum ada murojaah.</p>')};
function addMur(){return `<h3>Tambah Murojaah</h3><select id="ms">${SR.map(x=>`<option value="${x.id}">${x.nama}</option>`).join('')}</select><button class="btn" onclick="D.murojaah.push({sid:$S().id,s:+$('#ms').value,nilai:70,err:0,last:Date.now()});sv();closeM();go('murojaah')">Simpan</button>`}
function murDone(i){const m=D.murojaah[i];m.last=Date.now();m.nilai=Math.min(100,m.nilai+5);m.err=Math.max(0,m.err-1);addXP(20);sv();go('murojaah')}
/* Tajwid */
let tq='';
VIEWS.tajwid=()=>{const L=TJ.map((t,i)=>[t,i]).filter(x=>(x[0].t+x[0].c).toLowerCase().includes(tq.toLowerCase()));let c='';
 return `<h1>📚 Belajar Tajwid</h1><input placeholder="🔍 Cari materi..." value="${tq}" oninput="tq=this.value;$('#tjl').innerHTML=tjList()"><div id="tjl">${tjList()}</div>`};
function tjList(){let c='';return TJ.map((t,i)=>[t,i]).filter(x=>(x[0].t+x[0].c).toLowerCase().includes(tq.toLowerCase())).map(x=>{const h=x[0].c!=c?`<h3 style="margin:14px 0 6px;color:var(--g)">${x[0].c}</h3>`:'';c=x[0].c;return h+`<div class="card" style="cursor:pointer;margin-bottom:8px" onclick="tjM(${x[1]})"><b>${x[0].t}</b><p class="m">${x[0].p}</p></div>`}).join('')||'<p class="m">Materi tidak ditemukan.</p>'}
function tjM(i){const t=TJ[i];openM(`<h3>${t.t}</h3><p class="m">${t.c}</p><p><b>Pengertian:</b> ${t.p}</p><p><b>Hukum:</b> ${t.h}</p><p><b>Huruf:</b> ${t.hr}</p><p><b>Cara membaca:</b> ${t.ca}</p><p><b>Kesalahan umum:</b> ${t.k}</p><h3 style="margin-top:10px">Contoh ayat</h3><div id="tex"><p class="m">Memuat contoh ayat...</p></div><div class="row"><button class="btn" onclick="closeM();go('latihan')">Latihan</button><button class="btn o" onclick="closeM()">Tutup</button></div>`);
 Promise.all(t.ex.map(async e=>{await loadSurah(e[0]);const a=ayatDB.find(x=>x.surahId==e[0]&&x.nomorAyat==e[1]);return a?`<div class="card"><div class="ar" style="font-size:1.5rem">${a.teksArab}</div><p class="m">QS ${SR[e[0]-1].nama}: ${e[1]}${e[2]?' — '+e[2]:''}</p>${a.audio?`<button class="btn s o" onclick="playA('${a.audio}')">🔊 Dengar</button>`:''}</div>`:''})).then(h=>{const el=$('#tex');if(el)el.innerHTML=h.join('')||'<p class="m">Belum ada contoh ayat untuk materi ini; lihat contoh pola di cara membaca.</p>'})}
/* Latihan / quiz */
let Q=null;
VIEWS.latihan=()=>{if(!Q)Q={i:0,sc:0,ans:null};if(Q.i>=QZ.length){const n=Math.round(Q.sc/(QZ.length*10)*100),x=$S();x.quizBest=Math.max(x.quizBest,n);sv();const r=`<h1>📝 Selesai!</h1><div class="card stat"><b>Nilai: ${n}/100</b><span>${n>=80?'Bagus! Terus berlatih.':'Ayo belajar lagi, kamu pasti bisa!'}</span><br><button class="btn" onclick="Q=null;go('latihan')">Ulangi</button></div>`;return r}
 const q=QZ[Q.i];return `<h1>📝 Latihan Tajwid</h1><div class="card"><p class="m">Soal ${Q.i+1}/${QZ.length} • Skor ${Q.sc}</p><h3>${q[0]}</h3>${q[1].map((o,k)=>`<button class="opt ${Q.ans!=null?(k==q[2]?'ok':k==Q.ans?'no':''):''}" ${Q.ans!=null?'disabled':''} onclick="ans(${k})">${'ABCD'[k]}. ${o}</button>`).join('')}${Q.ans!=null?`<p>${Q.ans==q[2]?'✅ Benar!':'❌ Belum tepat.'} ${q[3]}</p><button class="btn" onclick="Q.i++;Q.ans=null;go('latihan')">Lanjut ›</button>`:''}</div>`};
function ans(k){Q.ans=k;if(k==QZ[Q.i][2]){Q.sc+=10;addXP(10)}go('latihan')}
/* Latihan hafalan: tebak surah, lanjutkan ayat, acak ayat, audio challenge */
let LH=null;const POOL=[112,113,114,111,110,109,108,107,106,105,104,103];
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const LHT={surah:['🔎 Tebak Surah','Lihat ayat, pilih nama surahnya'],lanjut:['➡️ Lanjutkan Ayat','Pilih ayat berikutnya yang benar'],acak:['🧩 Acak Ayat','Susun potongan ayat dengan urutan benar'],audio:['🎧 Audio Challenge','Dengarkan, lalu pilih surahnya']};
VIEWS.lathaf=()=>{if(!LH)return `<h1>🧩 Latihan Hafalan</h1><div class="grid2">${Object.keys(LHT).map(k=>`<div class="card" style="cursor:pointer" onclick="lhStart('${k}')"><h3>${LHT[k][0]}</h3><p class="m">${LHT[k][1]}</p></div>`).join('')}</div>`;
 if(LH.load)return '<p class="card">Menyiapkan soal...</p>';
 if(LH.err)return `<div class="card"><p>${LH.err}</p><button class="btn" onclick="LH=null;go('lathaf',1)">Kembali</button></div>`;
 if(LH.i>=LH.Q.length){const n=Math.round(LH.sc/LH.Q.length*100);return `<h1>Selesai!</h1><div class="card stat"><b>Nilai: ${n}/100</b><span>${n>=80?'MasyaAllah! Hebat, tetap istiqamah.':'Sedikit demi sedikit, InsyaAllah menjadi banyak. Ayo ulangi!'}</span><br><br><button class="btn" onclick="lhStart('${LH.t}')">Ulangi</button> <button class="btn o" onclick="LH=null;go('lathaf',1)">Menu</button></div>`}
 const q=LH.Q[LH.i],d=LH.ans!=null;let body;
 if(q.w)body=`<p>Susun potongan ayat dengan urutan yang benar:</p><div class="ar" style="min-height:70px;border:2px dashed var(--b);border-radius:14px;padding:6px">${LH.sel.map(k=>q.w[k]).join(' ')}</div><div class="row" style="justify-content:center;margin:10px 0">${q.w.map((w,k)=>LH.sel.includes(k)?'':`<button class="btn o" style="font-size:1.4rem" ${d?'disabled':''} onclick="LH.sel.push(${k});go('lathaf',1)">${w}</button>`).join('')}</div>${d?'':`<button class="btn" onclick="lhChk()">Periksa</button> <button class="btn o" onclick="LH.sel=[];go('lathaf',1)">Ulangi susun</button>`}`;
 else body=q.p+q.o.map((o,k)=>`<button class="opt ${d?(k==q.c?'ok':k==LH.ans?'no':''):''}" ${d?'disabled':''} onclick="lhA(${k})">${q.ar?`<span class="ar" style="font-size:1.4rem;display:block">${o}</span>`:o}</button>`).join('');
 return `<h1>${LHT[LH.t][0]}</h1><div class="card"><p class="m">Soal ${LH.i+1}/${LH.Q.length} • Benar ${LH.sc}</p>${body}${d?`<p>${LH.ok?'✅ Benar! +10 XP':'❌ Belum tepat.'} ${q.e}</p><button class="btn" onclick="LH.i++;LH.ans=null;LH.sel=[];go('lathaf',1)">Lanjut ›</button>`:''}</div>`};
async function lhStart(t){LH={t,load:1};go('lathaf',1);await Promise.all(POOL.map(loadSurah));const Q=lhBuild(t);LH=Q.length?{t,i:0,sc:0,Q,ans:null,sel:[]}:{err:'Teks ayat belum dapat dimuat. Periksa koneksi internet.'};go('lathaf',1)}
function lhBuild(t){const P=ayatDB.filter(a=>POOL.includes(+a.surahId)&&a.teksArab),Q=[],sn=id=>SR[id-1].nama;let g=0;
 const sO=a=>shuf([+a.surahId].concat(shuf(POOL.filter(x=>x!=a.surahId)).slice(0,3)));
 while(Q.length<5&&g++<300&&P.length>4){const a=P[Math.floor(Math.random()*P.length)];if(Q.some(q=>q.k==a.teksArab))continue;
  if(t=='surah'||t=='audio'){if(t=='audio'&&!a.audio)continue;const ids=sO(a);Q.push({k:a.teksArab,p:t=='surah'?`<div class="ar">${a.teksArab}</div><p>Ayat ini dari surah apa?</p>`:`<button class="btn" onclick="playA('${a.audio}')">🔊 Putar Audio</button><p>Ayat ini dari surah apa?</p>`,o:ids.map(sn),c:ids.indexOf(+a.surahId),e:`Ini surah ${sn(a.surahId)} ayat ${a.nomorAyat}.`})}
  else if(t=='lanjut'){const n=P.find(x=>x.surahId==a.surahId&&x.nomorAyat==a.nomorAyat+1);if(!n)continue;const o=shuf([n].concat(shuf(P.filter(x=>x.teksArab!=n.teksArab&&x.teksArab!=a.teksArab)).slice(0,3)));Q.push({k:a.teksArab,p:`<div class="ar">${a.teksArab}</div><p>Pilih ayat selanjutnya:</p>`,o:o.map(x=>x.teksArab),ar:1,c:o.indexOf(n),e:`Lanjutannya ayat ${n.nomorAyat} surah ${sn(n.surahId)}.`})}
  else{const w=a.teksArab.split(' ').filter(Boolean),m=shuf(w);if(w.length<3||w.length>8||m.join(' ')==w.join(' '))continue;Q.push({k:a.teksArab,w:m,tg:w.join(' '),e:'Urutan benar: '+w.join(' ')})}}
 return Q}
function lhA(k){const q=LH.Q[LH.i];LH.ans=k;LH.ok=k==q.c;if(LH.ok){LH.sc++;addXP(10)}go('lathaf',1)}
function lhChk(){const q=LH.Q[LH.i];LH.ok=LH.sel.map(k=>q.w[k]).join(' ')==q.tg;LH.ans=LH.ok?1:0;if(LH.ok){LH.sc++;addXP(10)}go('lathaf',1)}
/* Setoran */
let MR=null,chunks=[],lastURL=null,RB=null;
VIEWS.setoran=()=>{const r=ME.role;if(r=='santri')return `<h1>🎤 Setoran Hafalan</h1><div class="card"><div class="grid2"><div><label>Surah</label><select id="ss">${SR.map(x=>`<option value="${x.id}">${x.nama}</option>`).join('')}</select></div><div><label>Ayat (mis. 1-5)</label><input id="sa" value="1-5"></div></div><div class="row"><button class="btn r" onclick="rec()">🔴 Mulai Rekam</button><button class="btn o" onclick="stopRec()">⏹ Selesai</button></div><audio id="au" controls style="width:100%;margin-top:10px;display:none"></audio><p id="rs" class="m"></p><button class="btn" onclick="sendSet()">Kirim Setoran</button></div><h3>Riwayat</h3>`+setList(D.setoran.filter(x=>x.sid==$S().id),false);
 return `<h1>Penilaian Setoran</h1>`+setList(D.setoran,true)};
function setList(L,g){return L.slice().reverse().map(x=>{const i=D.setoran.indexOf(x),sn=D.santri.find(s=>s.id==x.sid);return `<div class="card"><div class="row sp"><b>${sn?sn.nama:'-'} • ${SR[x.s-1].nama} ${x.a}</b><span class="pill ${x.st=='W'?'Y':x.st=='L'?'G':'R'}">${x.st=='W'?'🟡 Menunggu':x.st=='L'?'🟢 Lulus':'🔴 Ulang'}</span></div>${x.n?`<p class="m">Kelancaran ${x.n[0]} • Tajwid ${x.n[1]} • Makhraj ${x.n[2]} • Panjang-Pendek ${x.n[3]}</p>`:''}${x.cat?`<p>“${x.cat}”</p>`:''}${x.f?`<button class="btn s o" onclick="playSet('${x.f}',this)">▶ Dengar Rekaman</button> `:''}${g&&x.st=='W'?`<button class="btn s" onclick="gradeF(${i})">Beri Nilai</button>`:''}</div>`}).join('')||'<p class="m">Belum ada setoran.</p>'}
async function rec(){try{const st=await navigator.mediaDevices.getUserMedia({audio:true});MR=new MediaRecorder(st);chunks=[];MR.ondataavailable=e=>chunks.push(e.data);MR.onstop=()=>{RB=new Blob(chunks,{type:MR.mimeType||'audio/webm'});lastURL=URL.createObjectURL(RB);const a=$('#au');if(a){a.src=lastURL;a.style.display='block'}st.getTracks().forEach(t=>t.stop())};MR.start();setTimeout(stopRec,120000);$('#rs').textContent='🔴 Merekam...'}catch(e){$('#rs').textContent='Rekaman tidak tersedia di perangkat/browser ini. Setoran tetap bisa dikirim.'}}
function stopRec(){if(MR&&MR.state=='recording'){MR.stop();$('#rs').textContent='Rekaman selesai.'}}
async function sendSet(){let f='';if(RB){$('#rs').textContent='Mengunggah rekaman...';
 const b64=await new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result.split(',')[1]);x.readAsDataURL(RB)});
 try{const r=await api('upload',{b64,mime:RB.type});if(r.err){alert('Gagal unggah rekaman: '+r.err);return}f=r.id}catch(e){alert('Tidak ada koneksi, rekaman gagal diunggah.');return}}
 D.setoran.push({sid:$S().id,s:+$('#ss').value,a:$('#sa').value,st:'W',t:Date.now(),f});RB=null;D.notif.push('🔔 Setoran dikirim, menunggu penilaian ustadz.');sv();alert('Menunggu penilaian ustadz.');go('setoran')}
async function playSet(id,b){b.textContent='Memuat...';try{const r=await api('audio',{id});b.textContent='▶ Dengar Rekaman';if(r.err){alert(r.err);return}AU.src=URL.createObjectURL(new Blob([Uint8Array.from(atob(r.b64),c=>c.charCodeAt(0))],{type:r.mime}));AU.play()}catch(e){b.textContent='▶ Dengar Rekaman';alert('Gagal memuat rekaman.')}}
function gradeF(i){openM(`<h3>Nilai Setoran</h3>${['Kelancaran','Tajwid','Makhraj','Panjang Pendek'].map((l,k)=>`<label>${l} (1–5)</label><input type="number" min="1" max="5" value="4" id="g${k}">`).join('')}<label>Catatan</label><textarea id="gc"></textarea><label>Status</label><select id="gs"><option value="L">🟢 Lulus</option><option value="U">🔴 Ulang</option></select><button class="btn" onclick="grade(${i})">Simpan</button>`)}
function grade(i){const x=D.setoran[i];x.n=[0,1,2,3].map(k=>Math.min(5,Math.max(1,+$('#g'+k).value||1)));x.cat=$('#gc').value;x.st=$('#gs').value;const s=D.santri.find(s=>s.id==x.sid);if(x.st=='L'&&s){s.xp+=D.set.xpSetor;s.setor++}
 const m=D.murojaah.find(m=>m.sid==x.sid&&m.s==x.s);if(m)m.nilai=Math.round(x.n.reduce((a,b)=>a+b)/20*100);D.notif.push('🔔 Setoran hafalan telah dinilai ustadz.');sv();closeM();go('setoran')}
/* Prestasi, target, absen, admin */
VIEWS.prestasi=()=>{const s=$S();return `<h1>🏆 Prestasi</h1><div class="card">Level ${lvl(s.xp)+1} — ${LV[lvl(s.xp)]} • ${s.xp} XP</div><div class="grid">${BD.map(b=>`<div class="bdg ${b[2](s)?'':'off'}"><div style="font-size:2rem">${b[0]}</div>${b[1]}</div>`).join('')}</div>`};
VIEWS.target=()=>`<h1>🎯 Target</h1>${D.targets.map((t,i)=>t.sid!=$S().id?'':`<div class="card">${bar(Math.round(t.done/t.target*100),t.t)}<p class="m">${t.done}/${t.target} halaman</p><button class="btn s" onclick="D.targets[${i}].done=Math.min(${t.target},D.targets[${i}].done+1);sv();go('target')">+1 halaman</button> <button class="btn s r" onclick="D.targets.splice(${i},1);sv();go('target')">Hapus</button></div>`).join('')}<div class="card"><input id="tt" placeholder="Nama target (harian/mingguan/bulanan)"><input id="tn" type="number" placeholder="Jumlah halaman"><button class="btn" onclick="if($('#tt').value&&+$('#tn').value>0){D.targets.push({sid:$S().id,t:$('#tt').value,target:+$('#tn').value,done:0});sv();go('target')}">Tambah Target</button></div>`;
VIEWS.absen=()=>{const ed=ME.role!='ortu',L=ME.role=='ortu'?D.att.filter(a=>a.sid==$S().id):D.att,h=L.filter(a=>a.st=='Hadir').length;
 return `<h1>🗓 Kehadiran</h1><div class="grid"><div class="card stat"><b>${h}</b><span>Total Hadir</span></div><div class="card stat"><b>${L.length?Math.round(h/L.length*100):0}%</b><span>Persentase</span></div></div>${ed?`<div class="card"><select id="as">${D.santri.map(s=>`<option value="${s.id}">${s.nama}</option>`).join('')}</select><select id="at">${['Hadir','Izin','Sakit','Alpa'].map(x=>`<option>${x}</option>`).join('')}</select><button class="btn" onclick="D.att.push({sid:+$('#as').value,st:$('#at').value,t:Date.now()});sv();go('absen')">Catat</button></div>`:''}${L.slice().reverse().slice(0,30).map(a=>`<div class="card row sp">${(D.santri.find(s=>s.id==a.sid)||{}).nama} • ${new Date(a.t).toLocaleDateString('id-ID')}<span class="pill ${a.st=='Hadir'?'G':a.st=='Alpa'?'R':'Y'}">${a.st}</span></div>`).join('')}`};
VIEWS.admin=()=>`<h1>⚙️ Admin & Ekspor</h1><div class="card"><h3>Pengaturan Lembaga</h3><label>Nama lembaga</label><input id="al" value="${D.set.lembaga}"><label>WhatsApp</label><input id="aw" value="${D.set.wa}"><label>XP per setoran lulus</label><input id="ax" type="number" value="${D.set.xpSetor}"><button class="btn" onclick="D.set={lembaga:$('#al').value,wa:$('#aw').value,xpSetor:+$('#ax').value||100};sv();alert('Tersimpan')">Simpan</button></div>
<div class="card"><h3>Ekspor Data</h3>${['santri','setoran','att','murojaah'].map(k=>`<div class="row" style="margin-bottom:8px"><b style="min-width:90px">${k}</b><button class="btn s" onclick="exp('${k}','csv')">CSV</button><button class="btn s o" onclick="exp('${k}','json')">JSON</button></div>`).join('')}<button class="btn s gold" onclick="window.print()">🖨 Cetak</button></div>
<div class="card"><h3>Pengguna</h3>${(D.users||[]).map(u=>`<div class="row sp"><span>${u.nama} (${u.u}) — ${u.role}</span>${u.u!='admin'?`<button class="btn s r" onclick="delUser('${u.u}')">Hapus</button>`:''}</div>`).join('')}
<h3 style="margin-top:12px">Tambah Pengguna</h3><input id="un1" placeholder="Nama lengkap"><input id="uu" placeholder="Username / No. HP" autocomplete="off"><input id="up" type="password" placeholder="Password (min. 6)" autocomplete="new-password"><select id="ur"><option value="santri">Santri</option><option value="ortu">Orang Tua</option><option value="ustadz">Ustadz</option><option value="admin">Admin</option></select><label class="m">Tautkan ke santri (untuk Santri/Orang Tua)</label><select id="us"><option value="">-</option>${D.santri.map(x=>`<option value="${x.id}">${x.nama}</option>`).join('')}</select><button class="btn" onclick="addUser()">Buat Akun</button></div>`;
async function addUser(){const x={nama:$('#un1').value.trim(),u:$('#uu').value.trim(),p:$('#up').value,role:$('#ur').value,sid:$('#us').value?+$('#us').value:''};
 if(!x.nama||!x.u){alert('Nama dan username wajib');return}if((x.role=='santri'||x.role=='ortu')&&!x.sid){alert('Pilih santri yang ditautkan');return}
 const r=await api('addUser',{user:x});if(r.err){alert(r.err);return}lp=0;alert('Akun dibuat');pull();D.users=(D.users||[]).concat([{u:x.u,role:x.role,nama:x.nama}]);go('admin',1)}
async function delUser(u){if(!confirm('Hapus akun '+u+'?'))return;const r=await api('delUser',{u});if(r.err){alert(r.err);return}D.users=D.users.filter(x=>x.u!=u);go('admin',1)}
function exp(k,f){const L=D[k];let t,m;if(f=='json'){t=JSON.stringify(L,null,1);m='application/json'}else{const c=L.length?Object.keys(L[0]).filter(x=>typeof L[0][x]!='object'):[];t=c.join(',')+'\n'+L.map(r=>c.map(x=>'"'+String(r[x]).replace(/"/g,'""')+'"').join(',')).join('\n');m='text/csv'}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=k+'.'+f;a.click()}
VIEWS.profil=VIEWS.home;
/* Init */
drawRoles();if(TK&&TK.u){ME=TK.u;role=ME.role;api('load').then(r=>{if(r.err){logout();return}D=Object.assign(JSON.parse(JSON.stringify(DEF)),r.db);start()}).catch(()=>{logout()})}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('service-worker.js').catch(()=>{});
</script></body></html>
